[project]
name = "woo-mcp"
version = "0.1.0"
description = "MCP server nad WooCommerce REST API pre praxu ADM Technics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.1,<3",
    "httpx>=0.27",
]

[project.scripts]
woo-mcp = "woo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/woo_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
